<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 커리어 진화 액셀러레이터</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">Next-Gen Career Architect</p>
      <h1>AI 커리어 진화 액셀러레이터</h1>
      <p>
        강점과 경력을 분석해 AI 시대에 연봉 성장을 노릴 수 있는 진화형 신직업과
        실행 로드맵을 제안합니다.
      </p>
    </header>

    <section class="panel">
      <h2>커리어 진단</h2>
      <form id="career-form">
        <div class="field-row">
          <div class="field field-card">
            <label for="current-role">현재 직무</label>
            <input
              id="current-role"
              name="current-role"
              type="text"
              placeholder="예: B2B SaaS 세일즈 오퍼레이션 매니저 (파이프라인 관리, CRM 자동화)"
            >
            <p class="hint">산업/역할/핵심업무까지 함께 적어주면 진단 정확도가 올라갑니다.</p>
          </div>

          <div class="field field-card">
            <label for="career-years">연차</label>
            <select id="career-years" name="career-years">
              <option value="">선택해주세요</option>
              <option>신입 (0년차)</option>
              <option>1년차</option>
              <option>2년차</option>
              <option>3년차</option>
              <option>4년차</option>
              <option>5년차</option>
              <option>6년차</option>
              <option>7년차</option>
              <option>8년차</option>
              <option>9년차</option>
              <option>10년차</option>
              <option>11년차</option>
              <option>12년차</option>
              <option>13년차</option>
              <option>14년차</option>
              <option>15년차</option>
              <option>16년차</option>
              <option>17년차</option>
              <option>18년차</option>
              <option>19년차</option>
              <option>20년차</option>
              <option>21년차</option>
              <option>22년차</option>
              <option>23년차</option>
              <option>24년차</option>
              <option>25년차</option>
              <option>26년차</option>
              <option>27년차</option>
              <option>28년차</option>
              <option>29년차</option>
              <option>30년차</option>
            </select>
          </div>
        </div>

        <div class="field field-card">
          <label>MBTI <span class="label-note">(최대 2개 선택)</span></label>
          <div id="mbti-grid" class="chips"></div>
          <p class="hint" id="mbti-hint">0 / 2 선택됨</p>
        </div>

        <div class="field field-card">
          <label>나의 강점 <span class="label-note">(최대 5개 선택)</span></label>
          <div id="strength-grid" class="chips chips--dense"></div>
          <p class="hint" id="strength-hint">0 / 5 선택됨</p>
        </div>

        <div class="field field-card">
          <label for="career-text">경력</label>
          <textarea id="career-text" placeholder="핵심 경력과 성과를 붙여넣어 주세요."></textarea>
          <div class="input-row">
            <input id="career-file" type="file" accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg">
            <input id="career-url" type="url" placeholder="이력서 URL (Notion, LinkedIn 등)">
          </div>
        </div>

        <div class="field field-card">
          <label>스킬</label>
          <div id="skills-wrap"></div>
          <button id="add-skill" type="button" class="btn btn--secondary">스킬 추가</button>
        </div>

        <div class="field field-card">
          <label for="weakness-text">기타 <span class="label-note">(ex. 나를 알 수 있는 정보)</span></label>
          <textarea id="weakness-text"></textarea>
          <div class="input-row">
            <input id="weakness-file" type="file" accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg">
            <input id="weakness-url" type="url" placeholder="참고 URL">
          </div>
        </div>

        <button type="submit" class="btn">커리어 진화 리포트 생성</button>
      </form>
    </section>

    <section id="report-panel" class="panel hidden">
      <h2>3) 커리어 진화 리포트 샘플/결과</h2>
      <div id="report" class="report empty">
        입력 후 리포트를 생성하면 여기에 결과가 표시됩니다.
      </div>
    </section>
  </main>

  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
