<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 커리어 진화 액셀러레이터</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <main class="app">
    <div class="top-actions">
      <div class="lang-switch" role="group" aria-label="Language switcher">
        <button type="button" class="lang-btn active" data-lang="ko">KO</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>

    <header class="hero">
      <p class="eyebrow" data-i18n="hero_eyebrow">Next-Gen Career Architect</p>
      <h1 data-i18n="hero_title">AI 커리어 진화 액셀러레이터</h1>
      <p data-i18n="hero_subtitle">
        나의 성격과 강점, 현재 경력과 보유 스킬을 분석해 AI 시대에 연봉 성장을 노릴 수 있는
        진화형 신직업과 실행 로드맵을 제안합니다.
      </p>
    </header>

    <section class="panel">
      <h2 data-i18n="section_diagnosis">커리어 진단</h2>
      <form id="career-form">
        <div class="field-row">
          <div class="field field-card">
            <label for="current-role" data-i18n="label_current_role">현재 직무</label>
            <input
              id="current-role"
              name="current-role"
              type="text"
              data-i18n-placeholder="ph_current_role"
            >
            <p class="hint" data-i18n="hint_current_role">산업/역할/핵심업무까지 함께 적어주면 진단 정확도가 올라갑니다.</p>
          </div>

          <div class="field field-card">
            <label for="career-years" data-i18n="label_career_years">연차</label>
            <select id="career-years" name="career-years">
            </select>
          </div>
        </div>

        <div class="field field-card">
          <label><span data-i18n="label_mbti">MBTI</span> <span class="label-note" data-i18n="note_mbti">(최대 2개 선택)</span></label>
          <div id="mbti-grid" class="chips"></div>
          <p class="hint" id="mbti-hint">0 / 2 선택됨</p>
        </div>

        <div class="field field-card">
          <label><span data-i18n="label_strengths">나의 강점</span> <span class="label-note" data-i18n="note_strengths">(최대 5개 선택)</span></label>
          <div id="strength-grid" class="chips chips--dense"></div>
          <p class="hint" id="strength-hint">0 / 5 선택됨</p>
        </div>

        <div class="field field-card">
          <label for="career-text" data-i18n="label_career">경력</label>
          <textarea id="career-text" data-i18n-placeholder="ph_career_text"></textarea>
          <div class="input-row">
            <input id="career-file" type="file" accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg">
            <input id="career-url" type="url" data-i18n-placeholder="ph_career_url">
          </div>
        </div>

        <div class="field field-card">
          <label data-i18n="label_skills">스킬</label>
          <div id="skills-wrap"></div>
          <button id="add-skill" type="button" class="btn btn--secondary" data-i18n="btn_add_skill">스킬 추가</button>
        </div>

        <div class="field field-card">
          <label for="weakness-text"><span data-i18n="label_etc">기타</span> <span class="label-note" data-i18n="note_etc">(ex. 나를 알 수 있는 정보)</span></label>
          <textarea id="weakness-text"></textarea>
          <div class="input-row">
            <input id="weakness-file" type="file" accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg">
            <input id="weakness-url" type="url" data-i18n-placeholder="ph_weakness_url">
          </div>
        </div>

        <button type="submit" class="btn" data-i18n="btn_submit">커리어 진화 리포트 생성</button>
      </form>
    </section>

    <section id="report-panel" class="panel hidden">
      <h2 data-i18n="section_report">커리어 진화 리포트 결과</h2>
      <div id="report" class="report empty">
        <span data-i18n="report_empty">입력 후 리포트를 생성하면 여기에 결과가 표시됩니다.</span>
      </div>
    </section>
  </main>

  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
